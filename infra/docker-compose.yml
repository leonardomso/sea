name: sea

services:
  spacetimedb:
    image: ${SPACETIME_IMAGE:-clockworklabs/spacetime@sha256:31f6d1d754f821362cec7e39e3680dd2efeb7a57f3ed0eb36c4cca1f12f46bb3}
    # The named volume is initialized by Docker as root. This local-only
    # service runs as root so SpacetimeDB can initialize its data directory.
    user: "0:0"
    entrypoint: ["spacetime"]
    command:
      - "--root-dir=/home/spacetime/data"
      - "start"
      - "--listen-addr=0.0.0.0:3000"
    ports:
      - "${SPACETIME_PORT:-43000}:3000"
    volumes:
      - spacetimedb-data:/home/spacetime/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/v1/ping >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  postgres:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sea_local}
      POSTGRES_USER: ${POSTGRES_USER:-sea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sea_local_only}
    ports:
      - "${POSTGRES_PORT:-45432}:5432"
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-46379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sea_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sea_local_only}
    ports:
      - "${MINIO_API_PORT:-49000}:9000"
      - "${MINIO_CONSOLE_PORT:-49001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    environment:
      NODE_ENV: production
      SEA_SPACETIMEDB_URL: http://spacetimedb:3000
    depends_on:
      spacetimedb:
        condition: service_healthy
    ports:
      - "${ADMIN_PORT:-43001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(async r => process.exit(r.ok && (await r.json()).status === 'ok' ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  spacetimedb-data:
  postgres18-data:
  redis-data:
  minio-data:
